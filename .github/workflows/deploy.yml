name: Deploy to QA - update-cart

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t kalemat/17-update-cart:qa-latest .
          docker push kalemat/17-update-cart:qa-latest

      - name: Connect to EC2 and Deploy Container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_QA_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull kalemat/17-update-cart:qa-latest
            docker stop update-cart || true
            docker rm update-cart || true
            docker run -d --name update-cart -p 3037:3037 kalemat/17-update-cart:qa-latest
